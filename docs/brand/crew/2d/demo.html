<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ra is watching · RasanAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@600&family=JetBrains+Mono:wght@500&family=Mukta:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --rice: #f1f0ec; --indigo: #1b1f5e; --ink-2: #3f4368; --blue: #2a31a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--rice); overflow: hidden; cursor: default; user-select: none; -webkit-user-select: none; }
  body { display: grid; grid-template-rows: auto 1fr auto; font: 16px/1.4 Mukta, "Avenir Next", system-ui, sans-serif; color: var(--ink-2); }
  header, footer { padding: 28px 40px; display: flex; justify-content: space-between; align-items: baseline; }
  .eyebrow { font: 500 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); }
  h1 { font: 600 clamp(40px, 6vw, 72px)/1 "Anek Latin", "Avenir Next Condensed", sans-serif; color: var(--indigo); margin: 10px 0 0; letter-spacing: -0.015em; }
  main { display: grid; place-items: center; min-height: 0; }
  #stage { width: min(56vh, 80vw); cursor: pointer; }
  #stage svg { width: 100%; height: auto; display: block; overflow: visible; }
  footer { color: var(--ink-2); font-size: 15px; }
  .hint kbd { font: 500 12px "JetBrains Mono", monospace; border: 1px solid #e4e5ea; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: #fff; }
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">RasanAI crew</div><h1>Ra is watching.</h1></div>
  <div class="eyebrow" id="mood">Mascot · runs the set</div>
</header>
<main><div id="stage" aria-label="Ra, the RasanAI mascot, follows your pointer with his eyes"></div></main>
<footer><span class="hint">Move your pointer anywhere. Click Ra for <b>Action!</b>, double-click to make him hop.</span><span class="hint"><kbd>1</kbd>–<kbd>5</kbd> moods</span></footer>

<script type="module">
import { mountRa } from './ra-puppet.js';
import { mountRaRender } from './ra-render.js';
// default: Ra from the approved render with live eyes; ?style=vector shows the all-vector puppet
const vector = new URLSearchParams(location.search).get('style') === 'vector';
const stage = document.getElementById('stage');
const ra = vector ? mountRa(stage) : mountRaRender(stage);
const ANCHOR = vector ? { x: 0.5, y: 298 / 660 } : { x: (694 - 170) / 920, y: (466 - 90) / 1040 };
const svg = stage.querySelector('svg');
window.ra = ra;

function eyesOnScreen() {
  const r = svg.getBoundingClientRect();
  return { x: r.left + r.width * ANCHOR.x, y: r.top + r.height * ANCHOR.y, w: r.width };
}

let lastMove = performance.now(), lastX = 0, lastY = 0, startled = 0, mood = 'neutral', idleLook = 0;
function follow(x, y) {
  const e = eyesOnScreen();
  const dx = x - e.x, dy = y - e.y;
  // ease the reach so the eyes swing quickly near Ra and settle toward the edges of the page
  const reach = e.w * 1.4;
  const nx = Math.tanh(dx / reach * 1.6), ny = -Math.tanh(dy / reach * 1.6);
  ra.lookAt(nx, ny);
  // a fast flick of the pointer startles him for a moment
  const now = performance.now(), speed = Math.hypot(x - lastX, y - lastY) / Math.max(1, now - lastMove);
  if (speed > 4.5 && now - startled > 1500) { startled = now; ra.setExpression('surprised'); setTimeout(() => ra.setExpression(mood), 650); }
  lastX = x; lastY = y; lastMove = now;
  // close to his face: a happy look
  const near = Math.hypot(dx, dy) < e.w * 0.35;
  const want = near ? 'happy' : 'neutral';
  if (want !== mood && now - startled > 700) { mood = want; ra.setExpression(mood); }
}
addEventListener('pointermove', (e) => follow(e.clientX, e.clientY));
addEventListener('pointerdown', (e) => follow(e.clientX, e.clientY));
document.documentElement.addEventListener('pointerleave', () => { ra.lookAt(0, 0); mood = 'neutral'; ra.setExpression('neutral'); });

stage.addEventListener('click', () => ra.play('action'));
stage.addEventListener('dblclick', () => ra.play('hop'));
const moods = ['neutral', 'happy', 'surprised', 'focused', 'sleepy'];
addEventListener('keydown', (e) => { if (/^[1-5]$/.test(e.key)) { mood = moods[+e.key - 1]; ra.setExpression(mood); } else if (e.code === 'Space') { e.preventDefault(); ra.play('action'); } });

// left alone, Ra gets curious and looks around; after a long while he dozes off
const t0 = performance.now();
function loop() {
  const now = performance.now(), quiet = now - lastMove;
  if (quiet > 4000 && now - idleLook > 6000) { idleLook = now; ra.play('lookAround'); }
  if (quiet > 15000 && mood !== 'sleepy') { mood = 'sleepy'; ra.setExpression('sleepy'); }
  ra.update((now - t0) / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
