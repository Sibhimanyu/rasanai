name: Studio community release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (not a skill release)
        required: true
        default: '0.1.0'
      build:
        description: New monotonically increasing bundle build number
        required: true
      enable_updates:
        description: Enable Sparkle for a validated public release (requires signed feed)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Apple Silicon and Swift toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          echo "SWIFT_ID=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_ENV"
      # Reuse the SwiftPM checkouts, Sparkle artifact, Node download and compiled dependencies from the last run, so a
      # release only recompiles what changed. Keyed on the toolchain and Package.resolved; each run saves a fresh copy.
      - uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: studio-build-${{ env.SWIFT_ID }}-${{ hashFiles('apps/macos/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            studio-build-${{ env.SWIFT_ID }}-${{ hashFiles('apps/macos/Package.resolved') }}-
      - name: Build unnotarized Apple Silicon candidate
        env:
          STUDIO_VERSION: ${{ inputs.version }}
          STUDIO_BUILD: ${{ inputs.build }}
          STUDIO_ENABLE_UPDATES: ${{ inputs.enable_updates && '1' || '0' }}
        run: bash apps/macos/scripts/build-community.sh
      - name: Record bundled release configuration
        run: |
          cp "apps/macos/dist/RasanAI Studio.app/Contents/Info.plist" apps/macos/dist/release-info.plist
          codesign --verify --deep --strict "apps/macos/dist/RasanAI Studio.app"
          file "apps/macos/dist/RasanAI Studio.app/Contents/MacOS/RasanAIStudio"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-community-candidate
          path: |
            apps/macos/dist/*.dmg
            apps/macos/dist/*.sha256
            apps/macos/dist/release-info.plist
          if-no-files-found: error
