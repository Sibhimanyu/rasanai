name: site
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/scripts/stamp-studio-release.mjs"
      - ".github/workflows/site.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp latest Studio release into the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/stamp-studio-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
