name: selftest
# Testing is done by hand; this runs only when started from the Actions tab or `gh workflow run selftest`.
on:
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FFmpeg (footage reels)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Syntax
        run: for f in skills/rasanai/scripts/*.mjs skills/rasanai/scripts/lib/*.mjs; do node --check "$f"; done
      - name: Manifests
        run: node -e 'for (const f of [".claude-plugin/plugin.json",".claude-plugin/marketplace.json"]) JSON.parse(require("fs").readFileSync(f,"utf8"))'
      - name: Self-test (headless Chrome from the runner)
        env:
          RASANAI_CHROME: /usr/bin/google-chrome
        run: node skills/rasanai/scripts/selftest.mjs
