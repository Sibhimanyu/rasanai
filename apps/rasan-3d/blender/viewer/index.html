<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rasan · Blender asset inspection</title>
  <style>
    * { box-sizing:border-box } body { margin:0; background:#eeeae1; color:#292825; font:14px system-ui,sans-serif; }
    main { max-width:1040px; margin:auto; padding:24px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:baseline; }
    h1 { font-size:20px; font-weight:600; margin:0 0 12px; } p { margin:0; color:#625d54; }
    #viewport { width:100%; height:min(72vh,760px); min-height:380px; } canvas { display:block; width:100%; height:100%; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; }
    button,select { font:inherit; padding:9px 12px; border:1px solid #c6c0b5; border-radius:6px; background:#faf8f3; color:inherit; }
    input { flex:1; min-width:160px; accent-color:#69512f; } output { font-variant-numeric:tabular-nums; min-width:70px; }
    #error { color:#9b221e; white-space:pre-wrap; } .capture main { padding:0; max-width:none; }
    .capture header,.capture .controls,.capture #status { display:none; } .capture #viewport { height:100vh; }
  </style>
</head>
<body><main>
  <header><h1>Rasan</h1><p>Blender asset · drag to orbit · scroll to zoom</p></header>
  <div id="viewport"></div>
  <div class="controls"><label for="clip">Action</label><select id="clip"><option>Reference</option></select>
    <button id="play">Play</button><input id="time" aria-label="Animation time" type="range" min="0" max="1" step="0.001" value="0"><output id="clock">0.00 s</output>
  </div>
  <div class="controls" id="views"><button data-az="-0.16">Reference</button><button data-az="0">Front</button><button data-az="1.570796">Left</button><button data-az="-1.570796">Right</button><button data-az="-0.65">¾</button><button data-az="3.141593">Back</button></div>
  <p id="status" role="status">Loading Rasan.glb…</p><p id="error" role="alert"></p>
</main><script type="module" src="./viewer.js"></script></body>
</html>
