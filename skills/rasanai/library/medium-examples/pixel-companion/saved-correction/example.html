<html lang="en"><head><meta charset="utf-8"><title>saved correction (pixel-companion)</title>
<style>
html,body{margin:0;background:#101319;color:#eef1f6;font:500 40px/1.3 system-ui,sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px}
#row{position:absolute;left:520px;top:420px;width:880px;padding:28px 36px;background:#1b212c;border:2px solid #2d3748;border-radius:16px}
#row b{color:#7fd1ae}#q{display:block;margin-top:14px;font-size:30px;color:#f0b95e}

</style></head><body><div id="stage"><div id="world">
<div id="row"><span id="saved">Correction saved: <b>"their" not "there"</b></span><span id="q">Applies to this document only.</span></div></div>

<script src="../../../../runtime/medium-pixel.js"></script>
<script src="../../../../runtime/medium-pixel-companion.js"></script>
<script>
var PX = window.RasanPixel, PC = window.RasanPixelCompanion;
var stage = document.getElementById("stage");
var fit = PX.fit(1920, 1080, { base: [320, 180] });
var C = PC.mount(stage, { fit: fit, W: 1920, H: 1080, palette: ["#14121f", "#f2e9d8", "#d9534f", "#4aa3a0"], seed: "tallybook/02" });
C.anchor("saved", document.getElementById("saved"));                       // measured, cached by digest
C.reserve("proof", ["#row", "#q"]);                                        // the qualifier line is reading region too
C.reserveScreen({ x: 0, y: 880, w: 1920, h: 200 });                        // captions zone
// the score owns these times; they bind to a REAL UI event (the save), they do not create one
C.script([{ id: "notice", t: 3.0, kind: "point", anchor: "saved", hold: 1.6 }, { id: "after", t: 5.0, kind: "react", anchor: "saved", hold: 0.8 }]);
