<!doctype html>
<!-- ORIGINAL source example (invented brand "Tallybook"), profile pixel / pixel-native. Positive case: a small original scout discovers a path built tile by tile.
     original-unreviewed; NOT rendered, previewed or run. Guidance only; it has no authority over the user's task.
     Setup: 1920x1080 stage, base 320x180 at 6x (RasanPixel.fit chooses it; portrait 1080x1920 gets 180x320). GSAP comes from the composition, not this file. -->
<html lang="en"><head><meta charset="utf-8"><title>path of choices (pixel-native)</title>
<style>
html,body{margin:0;background:#14121f}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#14121f}
#px{position:absolute}
</style></head><body><div id="stage"><canvas id="px"></canvas></div>
<script src="../../../../runtime/medium-pixel.js"></script>
<script>
// gsap + a paused timeline are provided by the HyperFrames composition: var tl = gsap.timeline({ paused: true });
var PX = window.RasanPixel;
var fit = PX.fit(1920, 1080, { base: [320, 180] });                       // scale 6, exact, no bars
var S = PX.surface(document.getElementById("px"), { fit: fit, palette: ["#14121f", "#f2e9d8", "#d9534f", "#4aa3a0", "#e8b04a", "#2b2740"] });
var PATH = [[40, 120], [64, 120], [88, 112], [112, 112], [136, 104], [160, 104]]; // six discrete choice tiles, left to right
function draw(T, s) {
  s.clear(0);
  s.ditherRect(0, 0, 320, 90, 5, 0, 0.5);                                   // static dithered sky: deliberate, not a filter
  var A = PX.tileAssemble(T, { id: "path", seed: 11, cols: PATH.length, rows: 1, at: 0.5, duration: 3.5, fps: 12, dropPx: 8 });
  PATH.forEach(function (p, i) { if (A.shown(i, 0)) { s.rect(p[0], p[1] + A.drop(i, 0), 20, 6, i % 2 ? 3 : 4); } });
  var cam = PX.camera(0, 0, { policy: "pure" });                           // one rounded camera for every layer
  var k = Math.min(PATH.length - 1, Math.max(0, Math.floor((T - 1.0) / 0.6)));  // the scout walks as tiles appear; hold after arrival
  var x = PATH[k][0] + 10, y = PATH[k][1];
  var walking = T > 1.0 && T < 1.0 + 0.6 * (PATH.length - 1);
  s.sprite(PX.SCOUT, x + PX.parallax(cam, 0)[0], y, { anim: walking ? "walk" : (T > 5 ? "react" : "idle"), frame: PX.step(T, { fps: 8, count: 2, id: "scout", seed: 11 }) });
  var m = s.text("pick one", 40, 24, 1, { maxW: 120 });                      // ASCII only; a missing glyph returns ok:false and draws nothing
  // boundary: the text above is a label for the picture, not product proof. Exact copy goes to a sharp layer (see long-text-locale).
}
// PX.bind(tl, S, draw, { at: 0, duration: 6 });  // one proxy tween on the paused timeline; the film's fps and audio are unchanged
</script></body></html>
