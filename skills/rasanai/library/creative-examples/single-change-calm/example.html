<!doctype html>
<!-- ORIGINAL teaching scene (invented brand "Harbor"): a calm composition where exactly one thing changes. original-unreviewed; not rendered. -->
<html lang="en"><head><meta charset="utf-8"><title>single change calm</title>
<style>
html,body{margin:0;background:#0e1013;color:#dfe3ea;font:300 34px/1.3 system-ui,sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.t{position:absolute;left:0;right:0;top:420px;text-align:center;letter-spacing:.3em;text-transform:uppercase;opacity:.75}
.dot{position:absolute;left:944px;top:560px;width:32px;height:32px;border-radius:50%;background:#4a4f59;animation:go 1.4s 4s forwards}
.sub{position:absolute;left:0;right:0;top:660px;text-align:center;opacity:0;font-size:26px;animation:in 1s 5s forwards}
@keyframes go{to{background:#5ee0a0;box-shadow:0 0 40px #5ee0a066}}@keyframes in{to{opacity:.7}}
</style></head><body><div id="stage">
<div class="t">Harbor</div><div class="dot"></div><div class="sub">Everything is backed up.</div>
</div></body></html>
