<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Lumen Ledger (synthetic fixture, never ship)</title>
<style>
  html,body{margin:0;background:#0b0d12;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0b0d12;color:#f4f1ea;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  .clip{position:absolute;inset:0}
  .safe{position:absolute;left:96px;right:96px;top:54px;bottom:54px}
  h1{margin:0;font-size:150px;line-height:1;font-weight:800;letter-spacing:-3px;text-align:center}
  .mask{display:inline-block;overflow:hidden;vertical-align:top}
  .mask>span{display:inline-block}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
  .win{width:1100px;height:620px;border-radius:24px;background:#151922;border:2px solid #2a3140;position:relative;box-shadow:0 30px 80px #0008}
  .row{position:absolute;left:48px;right:48px;height:64px;border-radius:12px;background:#1d2330;display:flex;align-items:center;padding:0 24px;font-size:30px;color:#c9c4b8}
  .chip{position:absolute;right:48px;top:48px;padding:14px 28px;border-radius:999px;background:#f2b84b;color:#1a1305;font-size:30px;font-weight:700}
  .hitcard{width:620px;height:620px;border-radius:40px;background:linear-gradient(135deg,#f2b84b,#e8704a);display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:#1a1305}
  .sub{font-size:44px;color:#9aa3b5}
  /* 9:16 variant: build.mjs --variant vertical sets data-variant="vertical" and the stage size */
  #stage[data-variant="vertical"]{width:1080px;height:1920px}
  #stage[data-variant="vertical"] h1{font-size:112px}
  #stage[data-variant="vertical"] .win{width:900px;height:760px}
  #stage[data-variant="vertical"] .hitcard{width:560px;height:560px}
</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines={};</script>
</head><body>
<div id="stage" data-composition-id="main" data-width="1920" data-height="1080" data-variant="landscape" data-start="0" data-duration="18">

  <!-- scene 1: kinetic text hook, hold from ~1.4 s to 5 s -->
  <section class="clip" id="scene-1" data-scene="scene-1" data-start="0" data-duration="5" data-track-index="1" data-motion-kit="motion-kit:kinetic-type-text-mask-v1@1">
    <div class="center">
      <h1 data-el="scene-1.hero-title" data-el-label="Hero title" data-el-editable="text,color,timing"><span class="mask"><span class="w">Every</span></span> <span class="mask"><span class="w">coin</span></span> <span class="mask"><span class="w">tells</span></span> <span class="mask"><span class="w">a story.</span></span></h1>
      <div class="sub" data-el="scene-1.subtitle" data-el-label="Subtitle">Lumen Ledger, the quiet spending diary.</div>
    </div>
  </section>

  <!-- scene 2: synthetic UI transition -->
  <section class="clip" id="scene-2" data-scene="scene-2" data-start="5" data-duration="5" data-track-index="1">
    <div class="center">
      <div class="win" data-el="scene-2.ledger-window" data-el-label="Ledger window">
        <div class="row" style="top:48px;width:560px" data-el="scene-2.row-a">Coffee beans <b style="margin-left:auto">6.40</b></div>
        <div class="row" style="top:136px" data-el="scene-2.row-b">Bike repair <b style="margin-left:auto">32.00</b></div>
        <div class="row" style="top:224px" data-el="scene-2.row-c">Seed packets <b style="margin-left:auto">9.15</b></div>
        <div class="chip" data-el="scene-2.chip" data-el-label="Saved chip">Saved</div>
      </div>
    </div>
  </section>

  <!-- scene 3: picture hit on the beat at film time 11.0 s (scene-local 1.0 s) -->
  <section class="clip" id="scene-3" data-scene="scene-3" data-start="10" data-duration="4.5" data-track-index="1">
    <div class="center">
      <div class="hitcard" data-el="scene-3.hit-card" data-el-label="Beat picture">L</div>
      <div class="sub" data-el="scene-3.caption">One tap, one entry.</div>
    </div>
  </section>

  <!-- scene 4: end card, safe-area hold from 15.6 s to the cut at 18 s -->
  <section class="clip" id="scene-4" data-scene="scene-4" data-start="14.5" data-duration="3.5" data-track-index="1" data-motion-kit="motion-kit:ending-hold-then-cut-v1@1">
    <div class="safe"><div class="center">
      <h1 data-el="scene-4.end-title" data-el-label="End title">Lumen Ledger</h1>
      <div class="sub" data-el="scene-4.end-line">Free on every desk.</div>
    </div></div>
  </section>

  <audio id="beat" src="assets/beat.wav" data-start="0" data-duration="18" data-track-index="2" data-volume="1"></audio>
</div>
<script>
(function () {
  var tl = gsap.timeline({ paused: true, defaults: { lazy: false } });
  var q = function (s) { return document.querySelector(s); };
  // scene 1: masked word rise, then hold (nothing moves from 1.4 s to 5 s)
  tl.set("#scene-1", { autoAlpha: 0 }, 0).set("#scene-1", { autoAlpha: 1 }, 0.001)
    .fromTo("#scene-1 .w", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power3.out", stagger: 0.18 }, 0.2)
    .fromTo(q("[data-el='scene-1.subtitle']"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0)
    .set("#scene-1", { autoAlpha: 0 }, 5);
  // scene 2: window slides in, rows stagger, chip pops
  tl.set("#scene-2", { autoAlpha: 0 }, 0).set("#scene-2", { autoAlpha: 1 }, 5)
    .fromTo(q("[data-el='scene-2.ledger-window']"), { y: 120, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 5.1)
    .fromTo("#scene-2 .row", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out", stagger: 0.25 }, 5.8)
    .fromTo(q("[data-el='scene-2.chip']"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 7.4)
    .set("#scene-2", { autoAlpha: 0 }, 10);
  // scene 3: the picture lands exactly on the beat at 11.0 s
  tl.set("#scene-3", { autoAlpha: 0 }, 0).set("#scene-3", { autoAlpha: 1 }, 10)
    .set(q("[data-el='scene-3.hit-card']"), { scale: 0.001 }, 10)
    .to(q("[data-el='scene-3.hit-card']"), { scale: 1, duration: 0.18, ease: "power4.out" }, 11.0)
    .fromTo(q("[data-el='scene-3.caption']"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 11.4)
    .set("#scene-3", { autoAlpha: 0 }, 14.5);
  // scene 4: end card settles by 15.6 s and holds still to the cut
  tl.set("#scene-4", { autoAlpha: 0 }, 0).set("#scene-4", { autoAlpha: 1 }, 14.5)
    .fromTo(q("[data-el='scene-4.end-title']"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out" }, 14.8)
    .fromTo(q("[data-el='scene-4.end-line']"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 15.3);
  tl.set({}, {}, 18);
  window.__timelines["main"] = tl;
})();
</script>
</body></html>
