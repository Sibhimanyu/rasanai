<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RasanAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' role='img' aria-label='RasanAI'><title>RasanAI</title><rect width='100' height='100' rx='22' fill='%231B1F5E'/><g transform='translate(22.94 13.72) scale(0.56)'><path d='M0 0H102V62L38 126L23.858 111.858L82 53.716V20H20V82H0Z' fill='%23F1F0EC'/><path d='M36 31L60 46L36 61Z' fill='%23F1F0EC' stroke='%23F1F0EC' stroke-width='3' stroke-linejoin='round'/></g></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --panel-2: #f1efe9; --line: #e6e3dc; --line-2: #d6d2c8; --ink: #16181d; --ink-2: #4f5461; --ink-3: #6b707a;
    --accent: #1b1f5e; --accent-2: #2b3486; --accent-ink: #ffffff; --pick: #efb21a; --pick-soft: #fdf3d6; --ok: #1f7a4f; --ok-soft: #e3f5ec; --warn: #8a5a00; --err: #b3361f; --focus: #2b3486;
    --r: 14px; --display: "Anek Latin", "Avenir Next Condensed", sans-serif; --sans: "Mukta", "Avenir Next", ui-sans-serif, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 10; background: rgba(246,245,241,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 10px 22px; }
  .brandline { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: #eff0f2; padding: 3px; flex: none; }
  .brand { font: 700 17px/1 var(--display); font-stretch: 90%; white-space: nowrap; }
  .proj { color: var(--ink-3); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phases { display: flex; gap: 4px; }
  .phase { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-3); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
  .phase b { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); display: inline-grid; place-items: center; font: 500 10px/1 var(--mono); }
  .phase.done { color: var(--ink-2); } .phase.done b { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .phase.now { color: var(--ink); background: var(--panel); box-shadow: 0 0 0 1px var(--line); font-weight: 600; } .phase.now b { border-color: var(--accent); color: var(--accent); }
  .top-right { display: flex; justify-content: flex-end; align-items: center; gap: 12px; min-width: 0; }
  .status { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2); min-width: 0; }
  .status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  #decideRest { white-space: nowrap; flex: none; }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .status.working .dot { background: var(--pick); animation: pulse 1.1s ease-in-out infinite; }
  .status.waiting .dot { background: var(--accent); }
  .status.done .dot { background: var(--ok); }
  .status.offline .dot { background: var(--err); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(238,178,25,.55); } 50% { box-shadow: 0 0 0 6px rgba(238,178,25,0); } }
  .bar { height: 2px; overflow: hidden; }
  .bar.on::after { content: ""; display: block; height: 100%; width: 35%; background: linear-gradient(90deg, transparent, var(--pick), transparent); animation: slide 1.3s linear infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* layout */
  .app { display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; gap: 22px; padding: 22px; max-width: 1640px; margin: 0 auto; align-items: start; }
  .rail { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
  .rail h2 { margin: 0 0 12px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .feed { list-style: none; }
  .feed li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); animation: rise .35s ease-out; }
  .feed li:first-child { border-top: 0; }
  .feed li i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); margin-top: 6px; }
  .feed li.ok i { background: var(--ok); } .feed li.ask i { background: var(--accent); } .feed li.you i { background: var(--ink); } .feed li.warn i, .feed li.error i { background: var(--err); }
  .feed li.tool { font-size: 12.5px; padding: 5px 0; color: var(--ink-3); } .feed li.tool i { width: 6px; height: 6px; margin-top: 6px; background: var(--line-2); }
  .feed li.active { color: var(--ink); } .feed li.active i { background: var(--pick); animation: pulse 1.1s ease-in-out infinite; }
  .feed li time { display: block; font: 400 11px/1.4 var(--mono); color: var(--ink-3); margin-top: 1px; }
  .film { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .film-item { padding: 11px 0; border-top: 1px solid var(--line); animation: rise .35s ease-out; }
  .film-item:first-child { border-top: 0; padding-top: 0; }
  .film-item small { display: flex; justify-content: space-between; gap: 8px; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .film-item small button { background: none; border: 0; color: var(--ink-3); text-transform: none; letter-spacing: 0; font: 400 12.5px/1 var(--sans); text-decoration: underline; text-underline-offset: 2px; }
  .film-item small button:hover { color: var(--ink); }
  .film-item p { font-size: 14px; font-weight: 500; line-height: 1.4; color: var(--ink); }
  .film-item.pending p { color: var(--ink-2); font-weight: 400; }
  .film-empty { color: var(--ink-3); font-size: 13.5px; }
  .tell { margin-top: 14px; display: grid; gap: 8px; }
  .tell textarea { border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; background: var(--panel); min-height: 44px; resize: vertical; font-size: 14px; }
  .tell textarea:focus { border-color: var(--accent); outline: none; }
  .tell .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  .tell small { color: var(--ink-3); font-size: 12.5px; }

  /* stage */
  main { min-width: 0; }
  .stage-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 30px 30px; }
  .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
  .stephead h1 { font: 700 34px/1.05 var(--display); font-stretch: 90%; letter-spacing: -.01em; }
  .question { font: 600 22px/1.3 var(--display); font-stretch: 95%; color: var(--ink); max-width: 860px; margin: 10px 0 4px; }
  .context { color: var(--ink-2); max-width: 860px; margin-bottom: 16px; }
  .decision { margin: 12px 0 16px; padding: 12px 14px; border-left: 3px solid var(--ok); background: var(--ok-soft); border-radius: 0 10px 10px 0; color: var(--ink-2); max-width: 860px; }
  .decision b { color: var(--ink); font-weight: 600; }
  .ask-card { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,33,96,.10); }
  .ask-options { display: grid; gap: 10px; margin: 6px 0 14px; }
  .ask-opt { display: grid; grid-template-columns: 22px 1fr auto; gap: 14px; align-items: start; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--panel); }
  .ask-opt:hover { border-color: var(--line-2); }
  .ask-opt.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,33,96,.12); }
  .ask-opt .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); margin-top: 2px; }
  .ask-opt.on .radio { border: 6px solid var(--accent); }
  .ask-opt b { display: block; font-size: 16px; } .ask-opt span { display: block; color: var(--ink-2); font-size: 14px; margin-top: 2px; }
  .ask-opt em { font-style: normal; font: 600 11.5px/1 var(--sans); background: var(--pick); color: #2a1f00; padding: 6px 9px; border-radius: 999px; }
  .ask-text textarea { min-height: 64px; }
  .decide-row { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; gap: 18px; flex-wrap: wrap; }
  .discuss { margin-top: 22px; padding: 16px 18px; border-radius: 14px; background: var(--panel-2); }
  .thread { display: grid; gap: 8px; margin: 6px 0 12px; max-height: 320px; overflow: auto; }
  .msg { max-width: 78%; padding: 9px 12px; border-radius: 12px; font-size: 14.5px; line-height: 1.45; background: var(--panel); border: 1px solid var(--line); }
  .msg b { display: block; font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .msg.you { justify-self: end; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .msg.you b { color: var(--accent-ink); opacity: .7; }
  .dots { display: inline-flex; gap: 4px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; } .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .composer { display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { flex: 1; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; background: var(--panel); resize: vertical; font-size: 14.5px; }
  .composer textarea:focus { border-color: var(--accent); outline: none; }
  .stephead + .context { margin-top: 8px; }
  .stephead + div > .choices:first-child, .stephead + div > .brand-toggle:first-child { margin-top: 18px; }
  .link { background: none; border: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; font-size: 14.5px; }
  .link:hover { color: var(--ink); }
  .update { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; padding: 10px 14px; border-radius: 12px; background: var(--pick-soft); color: #5c4300; font-size: 14px; }
  .rest { margin: 0 0 14px; padding: 10px 14px; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--ink-2); font-size: 13.5px; }
  .working-card { display: grid; gap: 14px; }
  .working-card .now { display: flex; align-items: center; gap: 12px; font: 600 24px/1.2 var(--display); font-stretch: 92%; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--line-2); border-top-color: var(--pick); animation: spin .8s linear infinite; flex: none; }
  .working-card .detail { color: var(--ink-2); margin-left: 34px; }
  .working-card .clock { margin-left: 34px; font: 500 12.5px/1 var(--mono); color: var(--ink-3); }
  .working-card ol { list-style: none; margin-left: 34px; display: grid; gap: 6px; }
  .working-card ol li { font-size: 14px; color: var(--ink-2); }
  .working-card ol li::before { content: "✓"; color: var(--ok); margin-right: 8px; }
  .working-card .answer { margin-left: 34px; padding: 10px 14px; border-radius: 10px; background: var(--panel-2); font-size: 14px; color: var(--ink-2); }
  .empty { color: var(--ink-3); padding: 24px 0; max-width: 620px; }

  /* pick-one cards (direction, story, look, route, voice, music) */
  .choices { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .choices.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .choice { position: relative; display: flex; flex-direction: column; text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .choice:hover { border-color: var(--line-2); }
  .choice.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,33,96,.12); }
  .choice > img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .choice .body { padding: 14px 16px 16px; display: grid; gap: 6px; }
  .choice h2 { font: 700 19px/1.15 var(--display); font-stretch: 92%; }
  .choice p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .choice p.sub { color: var(--ink-3); font-size: 13px; }
  .choice p.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .choice .terms { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .choice .terms span { font: 400 11.5px/1 var(--mono); padding: 5px 7px; border-radius: 5px; background: var(--panel-2); color: var(--ink-2); }
  .choice .rare { font-size: 12.5px; color: var(--ink-3); }
  .choice audio { width: 100%; margin-top: 6px; }
  /* stories: one row each, the three frames large, the words beside them */
  .choices.stack { grid-template-columns: 1fr; }
  .choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choice .live { border-bottom: 1px solid var(--line); }
  .choice .live .frame { border: 0; border-radius: 0; }
  .choice .live iframe { pointer-events: none; }
  .choice .live .open { display: none; }
  .choices.stack .choice { display: grid; grid-template-columns: minmax(0, 3fr) minmax(180px, 1fr); align-items: center; }
  .choices.stack .choice .strip { border-bottom: 0; border-right: 1px solid var(--line); }
  .choices.stack .choice .pick { top: 10px; left: 10px; }
  .choices.stack .choice .body { padding-right: 46px; }
  .choice .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: var(--line); border-bottom: 1px solid var(--line); }
  .choice .strip figure { margin: 0; position: relative; }
  .choice .strip img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--panel-2); }
  .choice .strip figcaption { position: absolute; left: 6px; bottom: 6px; font: 600 10.5px/1 var(--sans); background: rgba(22,24,29,.78); color: #fff; padding: 4px 6px; border-radius: 5px; max-width: calc(100% - 12px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick { position: absolute; z-index: 2; top: 10px; left: 10px; background: var(--pick); color: #2a1f00; font: 600 11.5px/1 var(--sans); padding: 6px 9px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .pick.inline { position: static; justify-self: start; margin-bottom: 2px; box-shadow: none; }
  .choice .tick { position: absolute; z-index: 2; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: none; place-items: center; font-size: 14px; }
  .choice.on .tick { display: grid; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 22px; }
  .actions .hint { margin-left: auto; color: var(--ink-3); font-size: 13px; }
  .drawer { display: none; margin-top: 20px; border-top: 1px dashed var(--line-2); padding-top: 18px; }
  .drawer.open { display: block; }
  .dim-row { display: grid; grid-template-columns: 190px 1fr; gap: 12px; align-items: center; padding: 7px 0; }
  .dim-row > span { font-size: 14px; color: var(--ink-2); }
  .dim-row .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  /* style gallery */
  .spec { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .look-stage { margin: 4px 0 22px; border-radius: 14px; border: 1px solid var(--line-2, var(--line)); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .spec.spec-live .spec-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .spec.spec-live .spec-frame { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #101418; pointer-events: none; transition: opacity .35s ease; }
  .spec > .rp-stage { position: absolute; left: 0; top: 0; }
  .brand-toggle { margin: -6px 0 14px; }
  .choice.mini .body { padding: 9px 11px 11px; gap: 2px; }
  .choice.mini h2 { font-size: 15px; }
  .choice.mini .meta { font-size: 10px; }
  .choice.mini .tick { width: 22px; height: 22px; font-size: 12px; top: 8px; right: 8px; }

  /* shared panel parts (the step panels below use these) */
  .grid { display: grid; gap: 14px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
  .card.rec { border-color: var(--pick); box-shadow: 0 0 0 3px var(--pick-soft); }
  .card.chosen { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,33,96,.12); }
  .card h2 { font: 700 19px/1.2 var(--display); font-stretch: 92%; }
  .card .meta, .meta { font: 500 11px/1.4 var(--mono); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
  .card p { color: var(--ink-2); }
  .card .row { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font: 600 11px/1 var(--sans); padding: 5px 9px; border-radius: 99px; background: var(--panel-2); color: var(--ink-2); }
  .tag.rec { background: var(--pick); color: #2a1f00; }
  .tag.rare { background: var(--panel-2); color: var(--ink-2); }
  .btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 9px 18px; font-weight: 500; font-size: 14.5px; }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.big { padding: 13px 24px; font-size: 15.5px; }
  .btn.ghost { background: none; }
  .btn.small { padding: 6px 12px; font-size: 13.5px; }
  a.btn { color: var(--ink); text-decoration: none; display: inline-block; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .frame { position: relative; overflow: hidden; border-radius: 12px; background: #000; border: 1px solid var(--line); }
  .frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
  .frame .open { position: absolute; right: 8px; bottom: 8px; font: 500 11px/1 var(--mono); background: rgba(22,24,29,.75); color: #fff; padding: 6px 8px; border-radius: 6px; text-decoration: none; }
  .cellpick { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .cellpick button { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; text-align: left; }
  .cellpick button b { font: 600 12px/1 var(--mono); background: var(--ink); color: var(--bg); border-radius: 4px; padding: 2px 6px; margin-right: 8px; }
  .cellpick button.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,33,96,.12); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line-2); background: var(--panel); border-radius: 99px; padding: 6px 13px; font-size: 13.5px; color: var(--ink-2); }
  .chip.on { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
  .form { display: grid; gap: 16px; max-width: 760px; }
  .field label { display: block; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .field input, .field textarea, .field select { width: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .list { list-style: none; display: grid; gap: 8px; }
  .list li { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; color: var(--ink-2); }
  .shape { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 16px 0; }
  .shape div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .shape span { display: block; font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .stages { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0; }
  .stage { font: 500 12px/1 var(--mono); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink-3); background: var(--panel); }
  .stage.working { color: var(--warn); border-color: var(--pick); background: var(--pick-soft); }
  .stage.done { color: var(--ok); border-color: #bfe6d1; background: var(--ok-soft); }
  .stage.failed { color: var(--err); border-color: rgba(179,54,31,.4); }
  .log { font: 12.5px/1.6 var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-height: 380px; overflow: auto; }
  .log div { color: var(--ink-2); } .log .warn { color: var(--warn); } .log .error { color: var(--err); } .log .ok { color: var(--ok); }
  .log time { color: var(--ink-3); margin-right: 10px; }
  .media { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .media video, .media img { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: #000; display: block; }
  .track { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
  .track audio { width: 100%; margin-top: 6px; }
  /* above the Tell Claude bar (fixed at the bottom), dark text on the light ink colour so it reads on the dark page */
  .toast { position: fixed; right: max(20px, calc((100vw - 992px) / 2)); bottom: 92px; background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.45); padding: 12px 16px; border-radius: 10px; max-width: 380px; transform: translateY(12px); opacity: 0; visibility: hidden; pointer-events: none; transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s, visibility .25s; z-index: 30; }
  .toast.show { transform: none; opacity: 1; visibility: visible; }
  .timeline { display: flex; height: 54px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); margin: 14px 0 6px; }
  .timeline div { position: relative; border-right: 2px solid var(--panel); background: var(--panel-2); padding: 6px 8px; font: 500 11px/1.25 var(--mono); color: var(--ink-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .timeline div b { display: block; color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .timeline div i { position: absolute; left: -1px; top: 0; bottom: 0; width: 3px; background: var(--pick); }
  .tl-meta { font: 500 12px/1 var(--mono); color: var(--ink-3); margin-bottom: 16px; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .clip { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .clip.bad { opacity: .6; }
  .clip img { width: 100%; border-radius: 8px; display: block; background: #000; }
  .clip .row { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .clip details p { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  label.chk { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .inout { display: flex; gap: 6px; align-items: center; }
  .inout input { width: 70px; }
  .timeline div.card-seg { background: var(--pick-soft); }
  .reel-preview { max-height: 420px; max-width: 100%; border-radius: 12px; background: #000; display: block; margin-bottom: 8px; }
  h2.sub-h { font: 700 16px/1 var(--display); margin: 22px 0 6px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .swatch { display: flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); color: var(--ink-2); }
  .swatch i { display: block; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); }
  .warn-line { color: var(--warn); font-size: 13.5px; margin: 4px 0; }
  .formula { background: var(--panel-2); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .formula ol { margin: 8px 0 0 18px; font: 500 13px/1.6 var(--mono); color: var(--ink); }
  details.dim { border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; }
  details.dim.set { border-color: var(--accent); }
  details.dim > summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 12px; align-items: baseline; list-style: none; }
  details.dim > summary .meta { color: var(--ink-3); }
  details.dim > *:not(summary) { margin-left: 14px; margin-right: 14px; }
  .fam { font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 14px 14px 6px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .opt { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .opt b { font-size: 14px; }
  .opt span { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
  .opt small { font-size: 11.5px; color: var(--ink-3); line-height: 1.3; }
  .opt.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,33,96,.12); }
  .grid.frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  figure.sf { margin: 0; } figure.sf img { width: 100%; border-radius: 12px; display: block; background: #000; border: 1px solid var(--line); } figure.sf figcaption { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  table.scenes { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  table.scenes th { text-align: left; font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 0 6px; }
  table.scenes td { background: var(--panel-2); padding: 8px 6px; vertical-align: top; }
  table.scenes td:first-child { border-radius: 10px 0 0 10px; font: 500 12px/1 var(--mono); color: var(--ink-3); padding-top: 14px; }
  table.scenes td:last-child { border-radius: 0 10px 10px 0; white-space: nowrap; }
  .toolbar select { background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
  table.scenes input, table.scenes textarea, table.scenes select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13.5px; }
  table.scenes textarea { min-height: 52px; resize: vertical; }
  table.scenes .num { width: 70px; }
  .iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--ink-2); margin-left: 4px; }
  .warnbox { border: 1px solid rgba(179,54,31,.35); background: #fbeeea; color: var(--err); padding: 10px 14px; border-radius: 10px; margin: 12px 0; }
  @media (prefers-reduced-motion: reduce) { .status.working .dot, .feed li.active i, .spinner, .bar.on::after { animation: none; } }
  @media (max-width: 1200px) { .app { grid-template-columns: minmax(0, 1fr) 280px; } .rail.left { display: none; } }
  @media (max-width: 860px) { .choices { grid-template-columns: 1fr; } .choices.stack .choice { grid-template-columns: 1fr; } .choices.stack .choice .strip { border-right: 0; border-bottom: 1px solid var(--line); } .dim-row { grid-template-columns: 1fr; } .app { grid-template-columns: 1fr; padding: 14px; } .rail { position: static; max-height: none; } .top-in { grid-template-columns: 1fr; } .phases { overflow-x: auto; } .two, .cols { grid-template-columns: 1fr; } .stage-card { padding: 20px; } }

  /* ===== 1.0: one film page. Neutral dark surround (judge colour and motion honestly), one column, one primary
     action, type-led, the film is the only thing that moves. ===== */
  :root {
    --bg: #161616; --panel: #1e1e1e; --panel-2: #262626; --line: #2c2c2c; --line-2: #3a3a3a;
    --ink: #ededed; --ink-2: #b4b4b4; --ink-3: #8a8a8a;
    --accent: #efb21a; --accent-2: #f5c542; --accent-ink: #1a1300; --pick: #ededed; --pick-soft: #2a2a2a;
    --ok: #4cc38a; --ok-soft: #1c2b23; --warn: #e6b450; --err: #f07f6f; --focus: #efb21a;
    --display: "Inter Tight", "Inter", ui-sans-serif, system-ui, sans-serif; --sans: "Inter Tight", "Inter", ui-sans-serif, system-ui, sans-serif;
    --r: 10px;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { font: 400 15px/1.55 var(--sans); }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  .top { position: sticky; top: 0; z-index: 20; background: rgba(22,22,22,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1180px; margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 24px; }
  .wordmark { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; color: var(--ink); }
  .wordmark svg { width: 17px; height: 21px; margin-bottom: -5px; }
  .film-title { color: var(--ink-3); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .states { margin-left: auto; display: flex; gap: 16px; font-size: 13.5px; color: var(--ink-3); }
  .states span.now { color: var(--ink); font-weight: 600; }
  .states span.done { color: var(--ink-2); }
  .top .link { font-size: 13.5px; color: var(--ink-3); }
  .kbd { font: 500 11px/1 var(--mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 5px; }
  .page { max-width: 1040px; margin: 0 auto; padding: 36px 24px 180px; }
  .stage-card { background: transparent; border: 0; padding: 0; }
  .q { font: 600 28px/1.2 var(--display); letter-spacing: -.015em; margin: 0 0 6px; }
  .qsub { color: var(--ink-3); margin: 0 0 22px; font-size: 15px; }
  .statusline { display: flex; align-items: center; gap: 14px; margin-top: 26px; min-height: 44px; }
  .statusline .say { color: var(--ink-2); font-size: 15px; flex: 1; }
  .statusline .say b { color: var(--ink); font-weight: 600; }
  .statusline .say.needs b { color: var(--accent); }
  .primary-btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 22px; font: 600 15px/1 var(--sans); cursor: pointer; white-space: nowrap; }
  .primary-btn:hover { background: var(--accent-2); }
  .primary-btn[disabled] { opacity: .4; cursor: default; }
  .sec { background: none; border: 0; color: var(--ink-2); font: 500 14px/1 var(--sans); cursor: pointer; padding: 10px 6px; }
  .sec:hover { color: var(--ink); }
  .link { background: none; border: 0; color: var(--ink-2); text-decoration: none; cursor: pointer; }
  .link:hover { color: var(--ink); }
  /* brief */
  .source-box { width: 100%; max-width: 900px; margin: 6px 0 4px; padding: 16px 18px; font: 400 19px/1.5 var(--body, inherit); color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; resize: vertical; }
  .source-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .source-row { margin-top: 18px; }
  .brief-sentence { font: 500 34px/1.4 var(--display); letter-spacing: -.015em; max-width: 900px; margin: 18px 0 30px; color: var(--ink); }
  .brief-sentence .pick { position: static; display: inline; background: none; box-shadow: none; padding: 0; border: 0; border-radius: 0; font: inherit; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-2); text-decoration-thickness: 2px; text-underline-offset: 7px; cursor: pointer; }
  .brief-sentence .pick:hover, .brief-sentence .pick.open { text-decoration-color: var(--accent); }
  .menu { position: absolute; z-index: 40; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; min-width: 180px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: 500 15px/1 var(--sans); padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .menu button:hover, .menu button.on { background: var(--line); }
  .menu input { width: 100%; background: var(--bg); border: 1px solid var(--line-2); color: var(--ink); border-radius: 8px; padding: 9px 10px; font: inherit; margin-top: 4px; }
  .findings { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; max-width: 760px; }
  .findings li { font-size: 14.5px; line-height: 1.45; color: var(--ink-2, var(--ink)); padding-left: 14px; border-left: 2px solid var(--line-2); }
  .findings .src { margin-left: 8px; font-size: 12.5px; color: var(--ink-3); text-decoration: none; white-space: nowrap; }
  .findings a.src:hover { color: var(--accent); }
  .thumbs { display: flex; gap: 12px; flex-wrap: wrap; }
  .thumbs figure { margin: 0; width: 170px; }
  .thumbs img { width: 170px; aspect-ratio: 16/10; object-fit: cover; border-radius: 8px; display: block; background: var(--panel); }
  .thumbs figcaption { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
  /* films */
  .films { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .film { display: flex; flex-direction: column; justify-content: flex-start; cursor: pointer; border-radius: 12px; padding: 0; background: none; border: 0; text-align: left; color: inherit; }
  .film .spec { border-radius: 12px; border: 2px solid transparent; overflow: hidden; background: var(--panel); aspect-ratio: 16/9; }
  .film.on .spec { border-color: var(--accent); }
  .film .meta2 { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
  .film h3 { font: 600 18px/1.25 var(--display); margin: 0; }
  .film .angle { font-size: 12.5px; color: var(--ink-3); }
  .film p { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
  .film .why { color: var(--ink-3); font-size: 13.5px; margin-top: 6px; }
  .film .style-name { color: var(--ink-3); font-size: 13px; margin-top: 6px; }
  .film .spec-missing { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--ink-2); font-size: 18px; }
  .story-tab { text-align: left; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; cursor: pointer; color: inherit; font: inherit; }
  .story-tab:hover { border-color: var(--ink-3); }
  .story-tab.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .story-tab { display: flex; flex-direction: column; gap: 10px; }
  .story-tab .st-angle { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
  .story-tab .st-angle b { font-size: 11px; letter-spacing: .08em; color: var(--ink-2); }
  .story-tab.on .st-angle b, .story-tab .st-pick { color: var(--accent); font-style: normal; }
  .story-tab .st-headline { font: 600 18px/1.3 var(--display); color: var(--ink); margin: 0; min-height: 3.9em; }
  .story-tab .st-quiet { font-size: 13px; color: var(--ink-2); min-height: 2.6em; }
  .story-tab .st-quiet span { color: var(--ink-3); }
  .story-tab .st-name { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
  .story-tab.on .st-name { color: var(--ink); font-weight: 600; }
  .st-title { font: 600 30px/1.2 var(--display); margin: 0 0 14px; }
  .achieves { border: 1px solid var(--line-2); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; background: var(--panel); }
  .st-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .st-take { font: 500 22px/1.3 var(--display); margin: 8px 0 14px; }
  .st-facts { display: flex; gap: 28px; flex-wrap: wrap; font-size: 14px; }
  .st-facts span { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
  .how { margin-bottom: 18px; }
  .how p { margin: 6px 0; font-size: 15px; }
  .moves { margin-bottom: 22px; }
  .moves .mv-carrier { font-size: 13px; color: var(--ink-2); margin: 4px 0 12px; }
  .moves .mv-carrier span { color: var(--ink-3); }
  .mv-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .mv-row.mixed { grid-template-columns: minmax(0, 1.5fr) repeat(2, minmax(0, 1fr)); }
  .mv.text { padding: 14px 16px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--panel); }
  .mv-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-bottom: 6px; }
  .mv-at.inline { position: static; display: inline-block; background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); padding: 1px 8px; }
  .mv { margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .mv-frame { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--line-2); }
  .mv.lead .mv-frame { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .mv-frame video, .mv-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .mv-at { position: absolute; left: 10px; bottom: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,.58); color: #fff; font: 600 11px/1.4 var(--mono, ui-monospace, monospace); font-variant-numeric: tabular-nums; }
  .mv-title { font: 600 15px/1.3 var(--display); margin: 0; }
  .mv-line { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); margin: 0; }
  @media (max-width: 760px) { .mv-row { grid-template-columns: 1fr; } }
  .script { margin-top: 22px; }
  .script-why { margin: 0 0 12px; }
  .beats-table { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .brow { display: grid; grid-template-columns: 74px 1.1fr 1.3fr 1.4fr; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: start; }
  .brow:first-child { border-top: 0; }
  .brow.head { background: var(--panel); font: 500 11px/1.4 var(--mono, ui-monospace, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .brow .tc { font: 500 12.5px/1.5 var(--mono, ui-monospace, monospace); color: var(--ink-3); }
  .brow .os { font: 600 17px/1.35 var(--display); color: var(--ink); }
  .brow .vo { font-size: 14.5px; line-height: 1.5; color: var(--ink-2); font-style: italic; }
  .brow .vis { font-size: 13.5px; line-height: 1.5; color: var(--ink-3); }
  .brow.turn { background: rgba(239,178,26,.06); }
  .brow.turn .tc { color: var(--accent); }
  @media (max-width: 760px) { .brow { grid-template-columns: 60px 1fr; } .brow .vo, .brow .vis { grid-column: 2; } .brow.head .vo, .brow.head span:nth-child(4) { display: none; } }
  .film .beats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .film .beats figure { margin: 0; }
  .film .beats img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; display: block; background: var(--bg-2, #111); }
  .film .beats figcaption { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.3; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { background: none; border: 0; color: var(--ink-3); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--line-2); color: var(--ink); }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 22px; }
  /* player (animatic + final) */
  .player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; cursor: crosshair; }
  .player img, .player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .player img { background: #000; }
  .player .pin { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(0,0,0,.5); }
  .player .bigplay { position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.55); border: 0; cursor: pointer; }
  .player .bigplay::after { content: ""; display: block; margin-left: 25px; border-left: 20px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
  .transport { display: flex; align-items: center; gap: 12px; margin-top: 10px; color: var(--ink-3); font: 500 13px/1 var(--mono); }
  .transport button { background: none; border: 0; color: var(--ink); cursor: pointer; font-size: 16px; width: 28px; }
  .strip { display: flex; gap: 3px; margin-top: 12px; height: 58px; }
  .strip .cell { position: relative; border-radius: 6px; background: var(--panel); overflow: hidden; cursor: pointer; min-width: 26px; border: 1px solid var(--line); }
  .strip .cell img { width: 100%; height: 100%; object-fit: cover; opacity: .75; }
  .strip .cell.cur { border-color: var(--ink-2); }
  .strip .cell.cur img { opacity: 1; }
  .strip .cell span { position: absolute; left: 6px; bottom: 5px; font: 500 11px/1 var(--sans); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); white-space: nowrap; }
  .strip .cell.todo { background: repeating-linear-gradient(135deg, #1e1e1e 0 6px, #232323 6px 12px); }
  .strip .cell.working { background: #232323; }

    if (m.t !== lastReply) { lastReply = m.t; var r = document.getElementById("reply"); r.firstChild.innerHTML = ""; r.firstChild.appendChild(h("b", { text: "Claude" })); r.firstChild.appendChild(document.createTextNode(m.text)); r.classList.add("show"); clearTimeout(r._h); r._h = setTimeout(function () { r.classList.remove("show"); }, 14000); }
  }
  function statusLine(res) {
    var Ak = asking();
    var box = h("div", { class: "statusline" + (Ak ? " asking" : "") });
    if (Ak) {
      local.askSel = local.askFor === Ak.id ? local.askSel : Ak.recommended || ((Ak.options || [])[0] || {}).id; local.askFor = Ak.id;
      var wrap = h("div", { class: "ask2", style: "flex:1" }, [h("div", { class: "say needs" }, [h("b", { text: "Needs you: " }), Ak.question]), Ak.context ? h("div", { class: "qsub", style: "margin:4px 0 0", text: Ak.context }) : null]);
      var opts = h("div", { class: "opts2" }, (Ak.options || []).map(function (o) { return h("button", { class: local.askSel === o.id ? "on" : "", onclick: function () { local.askSel = o.id; [].forEach.call(opts.children, function (b, k) { b.classList.toggle("on", Ak.options[k].id === o.id); }); } }, [o.label + (Ak.recommended === o.id ? "  (my pick)" : ""), o.detail ? h("span", { text: o.detail }) : null]); }));
      var ta = h("textarea", { placeholder: Ak.placeholder || "Or type your answer, paste text or a link" });
      wrap.appendChild(opts); wrap.appendChild(ta);
      wrap.appendChild(h("div", { style: "margin-top:12px" }, [h("button", { class: "primary-btn", onclick: function () { send(Ak.step || S.current || "brief", "answer", { ask: Ak.id, choice: local.askSel, text: ta.value.trim() }, ta.value.trim()); }, text: "Send" })]));
      box.appendChild(wrap);
      return box;
    }
    var wait = waitingOnUser(), done = isDone();
    var say = done ? "Ready." : wait ? (res.hint || "Your call.") : (S.working && S.working.msg ? S.working.msg : "Working…");
    box.appendChild(h("div", { class: "say" + (wait ? " needs" : "") }, [wait && !done ? h("b", { text: "Needs you · " }) : !done ? h("b", { text: "Working · " }) : null, say]));
    (res.secondary || []).forEach(function (s) { box.appendChild(h("button", { class: "sec", onclick: s.run, text: s.label })); });
    if (res.primary && (wait || done)) box.appendChild(h("button", { class: "primary-btn", id: "primaryBtn", onclick: res.primary.run, text: res.primary.label }));
    return box;
  }
  function freshSession() { return !Object.keys(S.steps || {}).some(function (k) { return S.steps[k] && S.steps[k].status; }) && !(S.activity || []).some(function (a) { return a.level !== "sys"; }); }
  function screenFor(step, d) {
    if (!step || !S.steps[step]) return freshSession() ? startScreen() : workingScreen();
    var busy = !waitingOnUser() && d.status !== "done" && step !== "build" && !(step === "render" || step === "final");
    if (step === "brief") return d.status === "awaiting" ? briefScreen(d) : workingScreen();
    if (step === "story") return busy ? workingScreen() : storyScreen(d);
    if (step === "look" && d.styles) return busy ? workingScreen() : filmsScreen(d, "look");
    if (step === "films" || (step === "direction" && d.films)) return busy ? workingScreen() : filmsScreen(d);
    if (step === "animatic") return animaticScreen(d, step);
    if (step === "build") return buildScreen(d);
    if (step === "render" || step === "final") return finalScreen(d, step);
    if (busy && d.status !== "awaiting") return workingScreen();
    return panelScreen(d, step);
  }
  function render(force) {
    renderTop(); showReplies();
    if (document.getElementById("dd").classList.contains("open")) decisionsPanel();
    var step = PINNED || S.current;
    var d = S.steps[step] || {};
    var main = document.getElementById("main");
    var sig = [step, d.updated, d.status, (S.comments || []).length, S.ask && S.ask.id, S.ask && !!S.ask.answered, !!d.sent, local.inBrand, S.working && S.working.msg, (S.activity || []).length].join("|");
    // leave players and live previews running when nothing on this screen changed
    if (!force && main._sig === sig) return;
    var keepPlayer = main._step === step && (step === "animatic" || step === "render" || step === "final") && main._upd === d.updated && main._sig && main._sig.split("|")[3] === String((S.comments || []).length);
    if (keepPlayer && !force) { main._sig = sig; var sl = main.querySelector(".statusline"); if (sl) sl.replaceWith(statusLine(main._res || {})); return; }
    main._sig = sig; main._step = step; main._upd = d.updated;
    loops.forEach(clearInterval); loops = []; stopPlayer(); closeFloating();
    var res = screenFor(step, d); main._res = res;
    main.innerHTML = "";
    // a question from Claude goes on top of the screen, never under a tall animatic where it can't be seen
    var Ak = asking();
    if (Ak) main.appendChild(statusLine(res));
    main.appendChild(h("h1", { class: "q", text: res.q }));
    main.appendChild(res.body);
    if (!Ak) main.appendChild(statusLine(res));
    if (Ak && main._askShown !== Ak.id) { main._askShown = Ak.id; window.scrollTo({ top: 0, behavior: "smooth" }); }
  }

  document.getElementById("justMake").addEventListener("click", function () { send("*", "decide-rest", null); toast("I'll decide everything and stop only at the final review."); });
  document.getElementById("ddToggle").addEventListener("click", function () { var dd = document.getElementById("dd"); var open = !dd.classList.contains("open"); dd.classList.toggle("open", open); this.setAttribute("aria-expanded", open ? "true" : "false"); if (open) decisionsPanel(); });
  document.getElementById("tell").addEventListener("keydown", function (e) { if (e.key === "Enter" && this.value.trim()) { send(S.current || "brief", "note", null, this.value.trim()); this.value = ""; toast("Sent to Claude."); } if (e.key === "Escape") this.blur(); });
  document.addEventListener("keydown", function (e) {
    var typing = /input|textarea|select/i.test((e.target.tagName || "")) || e.target.isContentEditable;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); document.getElementById("tell").focus(); return; }
    if (e.key === "Escape") { closeFloating(); document.getElementById("dd").classList.remove("open"); return; }
    if (typing) return;
    if (e.key === " " && A && A.toggle) { e.preventDefault(); A.toggle(); }
    if ((e.key === "c" || e.key === "C") && A && A.commentHere) { e.preventDefault(); A.commentHere(); }
    if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && A && A.starts) { var i = 0; for (var k = A.starts.length - 1; k >= 0; k--) if (A.t >= A.starts[k] - 0.01) { i = k; break; } i = Math.max(0, Math.min(A.starts.length - 1, i + (e.key === "ArrowRight" ? 1 : -1))); A.seek(A.starts[i] + 0.01); }
    if (e.key === "Enter") { var b = document.getElementById("primaryBtn"); if (b) b.click(); }
    if (/^[123]$/.test(e.key) && document.querySelector(".films")) { var tiles = document.querySelectorAll(".film"); if (tiles[+e.key - 1]) tiles[+e.key - 1].click(); }
  });

  function onState(s) {
    var prev = S.current;
    S = s || { steps: {} };
    if (S.current !== prev && !PINNED) local = { inBrand: local.inBrand };
    render();
  }

  // live updates: the stream, a heartbeat every 15 s, and a watchdog that reconnects when the stream goes quiet
  // (laptop sleep, a stalled connection) or the console restarts; the console restarts on the same address
  var es = null, lastSeen = Date.now();
  function refresh() { return fetch("/api/state", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (s) { online = true; lastSeen = Date.now(); onState(s); }).catch(function () { online = false; renderTop(); }); }
  function connect() {
    if (es) try { es.close(); } catch (_) {}
    es = new EventSource("/api/events");
    es.addEventListener("state", function (e) { lastSeen = Date.now(); try { online = true; onState(JSON.parse(e.data)); } catch (_) {} });
    es.addEventListener("ping", function () { lastSeen = Date.now(); if (!online) { online = true; renderTop(); } });
    es.onopen = function () { lastSeen = Date.now(); online = true; renderTop(); };
    es.onerror = function () { online = false; renderTop(); };
  }
  setInterval(function () {
    if (Q.get("snapshot")) return;
    if (Date.now() - lastSeen > 40000) { lastSeen = Date.now(); connect(); refresh(); }
  }, 5000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !Q.get("snapshot")) { refresh(); if (!online) connect(); } });
  window.addEventListener("online", function () { if (!Q.get("snapshot")) { connect(); refresh(); } });
  // ?snapshot=1&step=<id>: a static render for stills (no live stream, which would keep the page "loading")
  if (PINNED) { viewing = PINNED; followCurrent = false; }
  fetch("/api/state").then(function (r) { return r.json(); }).then(function (s) { online = true; onState(s); }).catch(function () {});
  if (!Q.get("snapshot")) connect();
})();
