<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RasanAI · console redesign (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..800&family=Mukta:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --paper: #f6f5f1; --card: #ffffff; --ink: #16181d; --ink-2: #555a66; --ink-3: #6b707a; --line: #e6e3dc; --line-2: #d8d4ca;
    --indigo: #1a2160; --indigo-2: #2b3486; --turmeric: #eeb219; --tur-soft: #fdf3d6; --ok: #1f9d63; --ok-soft: #e3f5ec;
    --display: "Anek Latin", "Avenir Next Condensed", sans-serif; --body: "Mukta", "Avenir Next", sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
    /* tokens film/engine cells expect */
    --rice: #f0f0f2; --leaf: #1e5a3c; --silk: #b3165a; --mist: #dfe3ee; --indigo-ink: #0c1030;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  h1, h2, h3 { font-family: var(--display); font-stretch: 90%; letter-spacing: -0.01em; margin: 0; }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: 0; z-index: 10; background: rgba(246,245,241,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 12px 22px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 17px/1 var(--display); font-stretch: 90%; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--indigo); display: inline-grid; place-items: center; }
  .brand i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--turmeric); }
  .brand span { color: var(--ink-3); font-weight: 500; font-family: var(--body); font-size: 14px; margin-left: 6px; }
  .phases { display: flex; gap: 6px; }
  .phase { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-3); padding: 6px 10px; border-radius: 999px; }
  .phase b { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); display: inline-grid; place-items: center; font: 500 10px/1 var(--mono); }
  .phase.done { color: var(--ink-2); } .phase.done b { background: var(--ok); border-color: var(--ok); color: #fff; }
  .phase.done b::after { content: "✓"; } .phase.done b span { display: none; }
  .phase.now { color: var(--ink); background: var(--card); box-shadow: 0 1px 0 var(--line); font-weight: 600; } .phase.now b { border-color: var(--indigo); color: var(--indigo); }
  .top-right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .status { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2); max-width: 360px; }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .status.working .dot { background: var(--turmeric); animation: pulse 1.1s ease-in-out infinite; }
  .status.waiting .dot { background: var(--indigo); }
  .status.done .dot { background: var(--ok); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(238,178,25,.55); } 50% { box-shadow: 0 0 0 6px rgba(238,178,25,0); } }
  .ghost { background: transparent; border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; color: var(--ink-2); }
  .ghost:hover { border-color: var(--ink-2); color: var(--ink); }
  .bar { height: 2px; background: transparent; overflow: hidden; }
  .bar.on::after { content: ""; display: block; height: 100%; width: 35%; background: linear-gradient(90deg, transparent, var(--turmeric), transparent); animation: slide 1.3s linear infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 22px; padding: 22px; max-width: 1560px; margin: 0 auto; align-items: start; }
  .rail { position: sticky; top: 78px; }
  .rail h4 { margin: 0 0 12px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

  /* activity feed */
  .feed { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 140px); overflow: auto; }
  .feed li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); animation: rise .35s ease-out; }
  .feed li:first-child { border-top: 0; }
  .feed li i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-top: 6px; }
  .feed li.active i { background: var(--turmeric); animation: pulse 1.1s ease-in-out infinite; }
  .feed li.active { color: var(--ink); }
  .feed li small { display: block; font: 400 11px/1.4 var(--mono); color: var(--ink-3); margin-top: 2px; }
  .feed li .thumbs { display: flex; gap: 4px; margin-top: 7px; }
  .feed li .thumbs img, .feed li .thumbs span { width: 52px; height: 30px; border-radius: 4px; object-fit: cover; border: 1px solid var(--line); background: var(--card); }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* stage */
  .stage { min-height: 70vh; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 30px 32px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .q-eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
  .q-title { font-size: 34px; line-height: 1.05; font-weight: 700; margin-bottom: 8px; }
  .q-sub { color: var(--ink-2); margin: 0 0 22px; max-width: 46em; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 24px; }
  .primary { background: var(--indigo); color: #fff; border: 0; border-radius: 999px; padding: 13px 24px; font-weight: 600; font-size: 15.5px; }
  .primary:hover { background: var(--indigo-2); }
  .link { background: none; border: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; padding: 8px 6px; font-size: 14.5px; }
  .link:hover { color: var(--ink); }
  .hint { font-size: 13px; color: var(--ink-3); margin-left: auto; }

  /* start */
  .start { max-width: 760px; margin: 6vh auto 0; }
  .start h1 { font-size: 54px; line-height: .98; font-weight: 700; margin-bottom: 14px; }
  .start p { color: var(--ink-2); font-size: 17px; }
  .ask { margin-top: 26px; background: var(--card); border: 1.5px solid var(--line-2); border-radius: 16px; padding: 18px 20px; }
  .ask textarea { width: 100%; border: 0; resize: none; font: 500 21px/1.35 var(--body); color: var(--ink); background: transparent; outline: none; min-height: 58px; }
  .attach { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); }
  .chip.found { background: var(--ok-soft); border-color: #bfe6d1; color: #17603f; }
  .chip.add { background: transparent; border-style: dashed; }
  .start .actions { margin-top: 18px; }
  .start small { display: block; margin-top: 16px; color: var(--ink-3); font-size: 13.5px; }

  /* working view */
  .working { text-align: left; }
  .working .now { display: flex; align-items: center; gap: 12px; font: 600 22px/1.2 var(--display); font-stretch: 92%; margin-bottom: 6px; }
  .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--line-2); border-top-color: var(--turmeric); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .working .detail { color: var(--ink-2); margin: 0 0 20px 32px; }
  .live-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .live-grid .slot { aspect-ratio: 16/9; border-radius: 10px; background: linear-gradient(100deg, #efede7 30%, #f7f6f2 50%, #efede7 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; overflow: hidden; border: 1px solid var(--line); }
  .live-grid .slot img { width: 100%; height: 100%; object-fit: cover; display: block; animation: reveal .6s ease-out; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  /* choices */
  .choices { display: grid; gap: 14px; }
  .choices.three { grid-template-columns: repeat(3, 1fr); }
  .choices.six { grid-template-columns: repeat(3, 1fr); }
  .choices.four { grid-template-columns: repeat(2, 1fr); }
  .choice { position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 0; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .choice:hover { border-color: var(--line-2); }
  .choice.on { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(26,33,96,.12); }
  .choice img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-bottom: 1px solid var(--line); }
  .choice .body { padding: 14px 16px 16px; }
  .choice h3 { font-size: 19px; line-height: 1.15; margin-bottom: 4px; }
  .choice p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .choice .terms { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .choice .terms span { font: 400 11.5px/1 var(--mono); padding: 5px 7px; border-radius: 5px; background: var(--paper); color: var(--ink-2); }
  .pick { position: absolute; z-index: 2; top: 10px; left: 10px; background: var(--turmeric); color: #2a1f00; font: 600 11.5px/1 var(--body); padding: 6px 9px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .choice .tick { position: absolute; z-index: 2; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--indigo); color: #fff; display: none; place-items: center; font-size: 14px; }
  .choice.on .tick { display: grid; }
  .choice.text .body { padding: 18px 18px 20px; }
  .choice.text h3 { font-size: 22px; }
  .choice .why { margin-top: 10px; font-size: 13px; color: var(--ink-3); }

  /* plan summary card */
  .plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .plan > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .plan small { display: block; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .plan b { font: 700 18px/1.2 var(--display); font-stretch: 92%; }
  .seg { display: flex; gap: 4px; margin-top: 8px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); }
  .seg button.on { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .brandline { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--ok-soft); color: #17603f; font-size: 14.5px; }
  .sw { display: flex; gap: 4px; } .sw i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(0,0,0,.08); }

  /* fine-tune drawer */
  .drawer { margin-top: 18px; border-top: 1px dashed var(--line-2); padding-top: 16px; display: none; }
  .drawer.open { display: block; }
  .dim { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 8px 0; align-items: center; }
  .dim > span { font-size: 13.5px; color: var(--ink-2); }
  .dim .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .dim .opts button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--ink-2); }
  .dim .opts button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* audio rows */
  .audio { display: grid; gap: 10px; }
  .track { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); text-align: left; }
  .track.on { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(26,33,96,.1); }
  .track .play { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--paper); display: grid; place-items: center; }
  .track .play::after { content: ""; border-left: 10px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
  .track b { display: block; font-size: 15px; } .track small { color: var(--ink-3); font-size: 13px; }
  .wave { width: 120px; height: 26px; display: flex; align-items: center; gap: 2px; }
  .wave i { flex: 1; background: var(--line-2); border-radius: 2px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .two-col h3 { font-size: 16px; margin-bottom: 10px; }

  /* build */
  .scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .scene { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  .scene .th { aspect-ratio: 16/9; background: linear-gradient(100deg, #efede7 30%, #f7f6f2 50%, #efede7 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; position: relative; }
  .scene .th img { width: 100%; height: 100%; object-fit: cover; display: block; animation: reveal .6s ease-out; }
  .scene .meta { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; font-size: 13px; }
  .scene .meta span { color: var(--ink-3); font: 400 11.5px/1 var(--mono); }
  .state { font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 5px; background: var(--paper); color: var(--ink-3); }
  .state.working { background: var(--tur-soft); color: #8a6200; } .state.done { background: var(--ok-soft); color: #17603f; }
  .progress { height: 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; margin: 18px 0 6px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--indigo); transition: width .4s ease; }
  .final { display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; align-items: center; }
  .player { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .player img { display: block; width: 100%; }
  .player button { position: absolute; inset: 0; margin: auto; width: 72px; height: 72px; border-radius: 50%; border: 0; background: rgba(22,24,29,.78); }
  .player button::after { content: ""; display: block; margin-left: 28px; border-left: 22px solid #fff; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .player .dur { position: absolute; right: 12px; bottom: 12px; background: rgba(22,24,29,.8); color: #fff; font: 500 12px/1 var(--mono); padding: 5px 8px; border-radius: 5px; }
  .checks { list-style: none; margin: 14px 0 0; padding: 0; }
  .checks li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; display: flex; justify-content: space-between; }
  .checks li b { color: var(--ok); font-weight: 600; }

  /* your film rail */
  .film { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .film-item { padding: 12px 0; border-top: 1px solid var(--line); animation: rise .35s ease-out; }
  .film-item:first-of-type { border-top: 0; padding-top: 0; }
  .film-item small { display: flex; justify-content: space-between; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .film-item small a { color: var(--ink-3); text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: 12px; text-decoration: underline; cursor: pointer; }
  .film-item b { font-size: 14.5px; font-weight: 600; line-height: 1.35; display: block; }
  .film-item img { width: 100%; border-radius: 8px; border: 1px solid var(--line); margin-top: 8px; display: block; }
  .film-item .terms { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .film-item .terms span { font: 400 11px/1 var(--mono); padding: 4px 6px; border-radius: 4px; background: var(--paper); color: var(--ink-2); }
  .film-empty { color: var(--ink-3); font-size: 13.5px; }
  .tell { margin-top: 14px; display: flex; gap: 8px; }
  .tell input { flex: 1; border: 1px solid var(--line-2); border-radius: 999px; padding: 10px 14px; font: inherit; font-size: 14px; background: var(--card); outline: none; }
  .tell input:focus { border-color: var(--indigo); }

  .mock-note { position: fixed; left: 14px; bottom: 14px; background: var(--ink); color: #fff; font-size: 12.5px; padding: 8px 12px; border-radius: 8px; opacity: .88; z-index: 20; }

  /* engine cells (motion swatches) */
  .md-cell { --md-bg-c: var(--rice); --md-ink-c: var(--ink); --md-acc: var(--turmeric); --md-bg: var(--md-bg-c); --md-ink: var(--md-ink-c); position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--md-bg); color: var(--md-ink); display: grid; place-items: center; }
  .md-cell > .md-block { grid-area: 1 / 1; }
  .md-block { font-family: "Bricolage Grotesque", var(--display); font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; text-align: center; position: relative; will-change: transform; }
  .md-line { overflow: hidden; padding: 0.04em 0.06em; white-space: nowrap; }
  .md-line-in { display: block; } .md-word { display: inline-block; white-space: nowrap; } .md-char { display: inline-block; }
  .md-rule { height: max(2px, 0.045em); background: var(--md-acc); margin: 0.18em auto 0; width: 60%; transform: scaleX(0); }
  .md-cursor { display: inline-block; width: 0.5em; background: var(--md-acc); margin-left: 0.04em; }
  .md-subline { font-weight: 500; letter-spacing: 0.02em; line-height: 1.3; color: color-mix(in srgb, var(--md-ink) 70%, var(--md-bg)); }
  .t-paper { --md-bg-c: #f6f4ef; --md-ink-c: #16181d; --md-acc: #49d3a1; }
  .choice .md-cell { border-bottom: 1px solid var(--line); }
  .choice.swatch .body { padding: 12px 14px 14px; }

  @media (max-width: 1180px) { .app { grid-template-columns: minmax(0, 1fr) 280px; } .rail.left { display: none; } }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .rail { position: static; } .choices.three, .choices.six, .scenes, .plan, .two-col, .final { grid-template-columns: 1fr; } .top-in { grid-template-columns: 1fr; } .phases { overflow-x: auto; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&display=swap" />
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><i></i>RasanAI<span id="project">New video</span></div>
    <nav class="phases" id="phases" aria-label="Progress"></nav>
    <div class="top-right">
      <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">Ready</span></div>
      <button class="ghost" id="decide-rest" type="button" hidden>Claude decides the rest</button>
    </div>
  </div>
  <div class="bar" id="bar"></div>
</header>

<div class="app" id="app">
  <aside class="rail left" aria-label="What Claude is doing">
    <h4>What Claude is doing</h4>
    <ul class="feed" id="feed"><li><i></i><div>Waiting for your brief<small>the console is live</small></div></li></ul>
  </aside>

  <main class="stage" id="stage"></main>

  <aside class="rail right" aria-label="Your film">
    <h4>Your film</h4>
    <div class="film" id="film"><p class="film-empty">Every decision lands here. Click any of them to change it.</p></div>
    <div class="tell"><input id="tell" placeholder="Tell Claude anything…" /></div>
  </aside>
</div>

<div class="mock-note">Mockup · Claude's work is simulated</div>

<script src="../assets/gsap.min.js"></script>
<script src="../assets/engine.js"></script>
<script src="../assets/personalities.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var stage = $("#stage"), feed = $("#feed"), film = $("#film");
  var PHASES = ["Brief", "Direction", "Look & motion", "Style frames", "Build"];
  var auto = false; // "Claude decides the rest"
  var timers = [];
  function later(ms, fn) { var t = setTimeout(fn, auto ? Math.min(ms, 260) : ms); timers.push(t); return t; }
  function h(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }

  // ---------- chrome ----------
  function phases(i) {
    $("#phases").innerHTML = PHASES.map(function (p, k) { return '<span class="phase ' + (k < i ? "done" : k === i ? "now" : "") + '"><b><span>' + (k + 1) + '</span></b>' + p + '</span>'; }).join("");
  }
  function status(kind, text) {
    var s = $("#status"); s.className = "status " + kind; $("#status-text").textContent = text;
    $("#bar").className = "bar" + (kind === "working" ? " on" : "");
  }
  var lastLog = null;
  function log(text, sub, thumbs) {
    if (lastLog) lastLog.classList.remove("active");
    var li = h('<li class="active"><i></i><div>' + text + (sub ? "<small>" + sub + "</small>" : "") + (thumbs ? '<div class="thumbs">' + thumbs.map(function (t) { return t ? '<img src="' + t + '" alt="">' : "<span></span>"; }).join("") + "</div>" : "") + "</div></li>");
    feed.insertBefore(li, feed.firstChild);
    lastLog = li;
  }
  function logDone() { if (lastLog) lastLog.classList.remove("active"); }
  function filmAdd(key, label, bodyHtml) {
    var ex = film.querySelector('[data-k="' + key + '"]');
    var el = h('<div class="film-item" data-k="' + key + '"><small>' + label + '<a>change</a></small>' + bodyHtml + "</div>");
    var empty = film.querySelector(".film-empty"); if (empty) empty.remove();
    if (ex) ex.replaceWith(el); else film.appendChild(el);
  }
  function working(title, detail, slots) {
    stage.innerHTML = '<div class="card working"><div class="now"><span class="spinner"></span>' + title + '</div><p class="detail">' + detail + "</p>" + (slots ? '<div class="live-grid">' + Array.from({ length: slots }).map(function () { return '<div class="slot"></div>'; }).join("") + "</div>" : "") + "</div>";
  }
  function fillSlot(i, src) { var s = stage.querySelectorAll(".slot")[i]; if (s) s.innerHTML = '<img src="' + src + '" alt="">'; }
  // a sequence of work steps, then a question
  function run(steps, done) {
    var t = 0;
    steps.forEach(function (st) { t += st[0]; later(t, st[1]); });
    later(t + 500, function () { logDone(); done(); });
  }
  // one-question screen
  function ask(opts) {
    status("waiting", opts.status || "Waiting for you: one question");
    stage.innerHTML = "";
    var card = h('<div class="card"><div class="q-eyebrow">' + opts.eyebrow + '</div><h2 class="q-title">' + opts.title + '</h2><p class="q-sub">' + opts.sub + "</p></div>");
    card.appendChild(opts.body);
    var act = h('<div class="actions"><button class="primary" type="button">' + (opts.go || "Looks good, continue") + '</button>' + (opts.links || []).map(function (l) { return '<button class="link" type="button">' + l + "</button>"; }).join("") + '<span class="hint">' + (opts.hint || "Claude's pick is already selected") + "</span></div>");
    act.querySelector(".primary").addEventListener("click", function () { opts.next(); });
    [].forEach.call(act.querySelectorAll(".link"), function (b, i) { b.addEventListener("click", function () { if (opts.onLink) opts.onLink(i, card); }); });
    card.appendChild(act);
    if (opts.after) card.appendChild(opts.after);
    stage.appendChild(card);
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (auto) later(900, opts.next);
  }
  function choiceGrid(cls, items, render) {
    var g = h('<div class="choices ' + cls + '"></div>');
    items.forEach(function (it, i) {
      var b = h('<button type="button" class="choice ' + (it.kind || "") + (i === 0 ? " on" : "") + '">' + (i === 0 ? '<span class="pick">Claude\'s pick</span>' : "") + '<span class="tick">✓</span>' + render(it) + "</button>");
      b.addEventListener("click", function () { [].forEach.call(g.children, function (c) { c.classList.remove("on"); }); b.classList.add("on"); g.selected = i; });
      g.appendChild(b);
    });
    g.selected = 0;
    return g;
  }

  // ---------- 0. start ----------
  function start() {
    phases(-1);
    status("", "Ready");
    stage.innerHTML = "";
    var s = h('<div class="start"><h1>What are we making?</h1><p>Say it in a sentence. Drop in a link, a folder of footage, or your brand file. Claude does the rest and only asks you what matters.</p>' +
      '<div class="ask"><textarea id="brief" rows="2">A 45-second launch film for tally.app</textarea>' +
      '<div class="attach"><span class="chip">🔗 tally.app</span><span class="chip found">✓ Found DESIGN.md in this project</span><span class="chip add">+ Add footage or references</span></div></div>' +
      '<div class="actions"><button class="primary" id="go" type="button">Start</button><button class="link" id="justmake" type="button">Just make it. Only ask me before the final render.</button></div>' +
      "<small>You'll see every step Claude takes, live. Each question has Claude's pick already selected, so one click moves on.</small></div>");
    stage.appendChild(s);
    $("#go").addEventListener("click", briefWork);
    $("#justmake").addEventListener("click", function () { auto = true; briefWork(); });
  }

  // ---------- 1. brief ----------
  function briefWork() {
    $("#project").textContent = "Tally launch film";
    $("#decide-rest").hidden = false;
    feed.innerHTML = "";
    phases(0);
    status("working", "Reading your brief…");
    working("Getting to know Tally", "Reading your request, your brand file and your website. This takes a moment.", 3);
    run([
      [400, function () { log("Read your request", "launch film · 45 s · tally.app"); }],
      [900, function () { status("working", "Reading DESIGN.md…"); log("Read your brand file", "paper, ink and one mint accent · Bricolage Grotesque"); fillSlot(0, "img/brand-A.jpg"); }],
      [1100, function () { status("working", "Capturing tally.app…"); log("Capturing tally.app", "12 sections, 8 screenshots, copy and assets"); }],
      [1000, function () { fillSlot(1, "img/brand-D.jpg"); fillSlot(2, "img/brand-F.jpg"); log("Chose how to build it", "launch film workflow · 16:9 for your website"); }],
    ], briefAsk);
  }
  function briefAsk() {
    var body = h('<div><div class="plan">' +
      '<div><small>Kind</small><b>Launch film</b></div>' +
      '<div><small>Length</small><b>45 seconds</b><div class="seg"><button>30s</button><button class="on">45s</button><button>60s</button></div></div>' +
      '<div><small>Shape</small><b>16:9, website</b><div class="seg"><button class="on">16:9</button><button>9:16</button><button>1:1</button></div></div>' +
      '<div><small>Voiceover</small><b>Yes</b><div class="seg"><button class="on">Yes</button><button>No</button></div></div></div>' +
      '<div class="brandline"><div class="sw"><i style="background:#f6f4ef"></i><i style="background:#16181d"></i><i style="background:#49d3a1"></i><i style="background:#ffffff"></i></div>Using your brand from DESIGN.md: paper, ink, mint, Bricolage Grotesque.</div></div>');
    [].forEach.call(body.querySelectorAll(".seg"), function (seg) { [].forEach.call(seg.children, function (b) { b.addEventListener("click", function () { [].forEach.call(seg.children, function (x) { x.classList.remove("on"); }); b.classList.add("on"); b.closest("div").querySelector("b").textContent = b.textContent === "Yes" || b.textContent === "No" ? b.textContent : b.textContent.replace("s", " seconds"); }); }); });
    ask({ eyebrow: "1 of 6 · The plan", title: "Here's what I'll make. Look right?", sub: "Change anything with one click, or just continue.", body: body, go: "Looks right", links: ["Don't use my brand"], next: function () {
      filmAdd("brief", "The plan", "<b>Launch film · 45 s · 16:9 · voiceover</b>");
      filmAdd("brand", "Brand", '<b>Tally, from DESIGN.md</b><div class="terms"><span>paper</span><span>ink</span><span>mint</span><span>Bricolage</span></div>');
      directionWork();
    } });
  }

  // ---------- 2. direction ----------
  var DIRECTIONS = [
    { name: "Swiss grid launch film", img: "img/brand-A.jpg", terms: ["simplified UI", "Swiss grid", "grotesk", "precise motion", "UI morph"], why: "Your brand is calm and exact; a grid-led film lets the product speak." },
    { name: "Energetic neo-brutalist", img: "img/brand-D.jpg", terms: ["neo-brutalist UI", "hard offset shadow", "snappy motion", "hard cuts"], why: "Louder and faster; good if this launch is for social." },
    { name: "Quiet luxury reveal", img: "img/brand-E.jpg", terms: ["negative space", "single-object hero", "luxurious / slow", "dissolves"], why: "Slow and premium; the mint appears only once, at the payoff." },
  ];
  function directionWork() {
    phases(1);
    status("working", "Composing directions…");
    working("Composing three directions", "Choosing from 881 motion-design terms and 35 proven combinations, never the generic default.", 3);
    run([
      [500, function () { log("Matched your brand and brief to style combinations", "35 checked · 6 fit"); }],
      [900, function () { fillSlot(0, DIRECTIONS[0].img); log("Direction 1: Swiss grid launch film"); }],
      [800, function () { fillSlot(1, DIRECTIONS[1].img); log("Direction 2: energetic neo-brutalist"); }],
      [800, function () { fillSlot(2, DIRECTIONS[2].img); log("Direction 3: quiet luxury reveal", "passed over: SaaS minimalism, the generic default"); }],
    ], directionAsk);
  }
  function directionAsk() {
    var grid = choiceGrid("three", DIRECTIONS, function (d) { return '<img src="' + d.img + '" alt=""><div class="body"><h3>' + d.name + '</h3><p>' + d.why + '</p><div class="terms">' + d.terms.map(function (t) { return "<span>" + t + "</span>"; }).join("") + "</div></div>"; });
    var drawer = h('<div class="drawer"><div class="q-eyebrow">Fine-tune (optional)</div>' +
      dimRow("How the product appears", ["simplified UI", "abstracted UI", "exploded UI", "device-bound"]) +
      dimRow("Typography", ["grotesk", "editorial serif", "monospace", "condensed"]) +
      dimRow("Motion language", ["precise", "springy", "cinematic", "snappy"]) +
      dimRow("Transitions", ["UI morph", "hard cut", "mask reveal", "push"]) +
      dimRow("Pacing", ["medium", "fast", "slow", "beat-driven"]) +
      '<p class="q-sub" style="margin-top:10px">30 dimensions are available; these are the ones that matter most for a launch film.</p></div>');
    ask({ eyebrow: "2 of 6 · Direction", title: "Pick a direction", sub: "Each is a complete style: how the product appears, the look, the type, how things move and cut.", body: grid, after: drawer, go: "Use this direction", links: ["Show 3 more", "Fine-tune"], onLink: function (i) { if (i === 1) drawer.classList.toggle("open"); }, next: function () {
      var d = DIRECTIONS[grid.selected];
      filmAdd("direction", "Direction", "<b>" + d.name + '</b><div class="terms">' + d.terms.map(function (t) { return "<span>" + t + "</span>"; }).join("") + "</div>");
      storyWork();
    } });
  }
  function dimRow(label, opts) { return '<div class="dim"><span>' + label + '</span><div class="opts">' + opts.map(function (o, i) { return '<button type="button" class="' + (i === 0 ? "on" : "") + '">' + o + "</button>"; }).join("") + "</div></div>"; }

  // ---------- 3. story ----------
  var STORIES = [
    { name: "The shoebox wins", line: "Every spring, receipts pile up. One tap later, the books balance.", arc: "problem → solution · 9 scenes" },
    { name: "A year in 45 seconds", line: "Twelve months of receipts fly past as the month counter races to December.", arc: "timeline · 8 scenes" },
    { name: "Tax day, handled", line: "It's April 14. Everyone panics except the one person using Tally.", arc: "before → after · 7 scenes" },
  ];
  function storyWork() {
    status("working", "Writing stories…");
    working("Writing three stories", "One obvious and two a model would rarely write, each as a scene list and voiceover.");
    run([
      [600, function () { log("Pitched three stories", "two of them unusual on purpose"); }],
      [800, function () { log("Wrote the scene list for each", "voiceover timed to 45 s"); }],
    ], storyAsk);
  }
  function storyAsk() {
    var grid = choiceGrid("three", STORIES.map(function (s) { s.kind = "text"; return s; }), function (s) { return '<div class="body"><h3>' + s.name + "</h3><p>" + s.line + '</p><div class="why">' + s.arc + "</div></div>"; });
    ask({ eyebrow: "3 of 6 · Story", title: "Which story?", sub: "You can edit any scene later; this picks the idea.", body: grid, go: "Use this story", links: ["See the scenes", "Write my own"], next: function () {
      var s = STORIES[grid.selected];
      filmAdd("story", "Story", "<b>" + s.name + "</b><small style='display:block;margin-top:4px;color:var(--ink-3);font-size:12.5px;text-transform:none;letter-spacing:0;font-family:var(--body)'>" + s.arc + "</small>");
      lookWork();
    } });
  }

  // ---------- 4. look + motion ----------
  var LOOKS = ["A", "B", "C", "D", "E", "F"].map(function (k, i) { return { img: "img/brand-" + k + ".jpg", name: ["Swiss grid", "Pixel field", "HUD lines", "Stacked cards", "Poster", "Soft 3D"][i] }; });
  function lookWork() {
    phases(2);
    status("working", "Designing looks…");
    working("Designing six looks in your brand", "Same colors and typefaces; different composition, ground, shape and texture.", 6);
    var steps = LOOKS.map(function (l, i) { return [520, function () { fillSlot(i, l.img); if (i === 0) log("Designing looks in your brand", "palette locked to DESIGN.md"); if (i === 5) log("Six looks ready", "each with its own frame.md"); }]; });
    run(steps, lookAsk);
  }
  function lookAsk() {
    var grid = choiceGrid("six", LOOKS, function (l) { return '<img src="' + l.img + '" alt=""><div class="body"><h3>' + l.name + "</h3></div>"; });
    ask({ eyebrow: "4 of 6 · Look", title: "Pick a look", sub: "These are previews of the palette, type and layout. Claude draws the real frames next.", body: grid, go: "Use this look", links: ["Show 6 more"], next: function () {
      var l = LOOKS[grid.selected];
      filmAdd("look", "Look", "<b>" + l.name + '</b><img src="' + l.img + '" alt="">');
      motionAsk();
    } });
  }
  var MOTIONS = [
    { id: "swiss-precise", name: "Precise", note: "Exact, no overshoot. Suits your grid." },
    { id: "elastic-playful", name: "Springy", note: "A little bounce; friendlier." },
    { id: "cinematic-slow", name: "Cinematic", note: "Slow push-ins, long holds." },
    { id: "kinetic-punch", name: "Snappy", note: "Fast and punchy, for social." },
  ];
  var tls = [];
  function motionAsk() {
    var grid = choiceGrid("four", MOTIONS.map(function (m) { m.kind = "swatch"; return m; }), function (m) {
      return '<div class="md-cell t-paper" data-personality="' + m.id + '"><div class="md-block" data-content="Tax season. Again."></div><div class="md-block" data-content="One tap. Books done."></div><div class="md-block" data-content="tally.app"></div></div><div class="body"><h3>' + m.name + "</h3><p>" + m.note + "</p></div>";
    });
    ask({ eyebrow: "5 of 6 · Motion", title: "How should it move?", sub: "Your own lines, in four motion languages. The one you pick is enforced on every scene.", body: grid, go: "Use this motion", links: ["Slower", "Show others"], next: function () {
      tls.forEach(function (t) { t.kill(); }); tls = [];
      var m = MOTIONS[grid.selected];
      filmAdd("motion", "Motion", "<b>" + m.name + '</b><div class="terms"><span>one language for the whole film</span></div>');
      audioAsk();
    } });
    // live swatches (the real preview engine)
    if (window.gsap && window.MD && window.RASA_PERSONALITIES) {
      [].forEach.call(stage.querySelectorAll(".md-cell"), function (cell) {
        var p = window.RASA_PERSONALITIES[cell.getAttribute("data-personality")];
        if (!p) return;
        var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.6 });
        window.MD.build(tl, cell, p);
        tls.push(tl);
      });
    }
  }
  function audioAsk() {
    var wave = function (seed) { var s = ""; for (var i = 0; i < 26; i++) { var v = 20 + Math.abs(Math.sin(i * 1.7 + seed) * 70 + Math.cos(i * .6 + seed) * 20); s += '<i style="height:' + Math.min(100, v) + '%"></i>'; } return '<div class="wave">' + s + "</div>"; };
    var rows = function (list, seed) { return list.map(function (t, i) { return '<button type="button" class="track' + (i === 0 ? " on" : "") + '"><span class="play"></span><span><b>' + t[0] + (i === 0 ? " · Claude's pick" : "") + "</b><small>" + t[1] + "</small></span>" + wave(seed + i) + "</button>"; }).join(""); };
    var body = h('<div class="two-col"><div><h3>Voice</h3><div class="audio" id="voices">' + rows([["Maya", "warm, unhurried · reads your first line"], ["Arjun", "measured, confident"], ["No voiceover", "text and music only"]], 1) + '</div></div><div><h3>Music</h3><div class="audio" id="music">' + rows([["Felt piano", "84 bpm · warm, calm"], ["Soft pulse", "110 bpm · light, modern"], ["No music", "voice only"]], 5) + "</div></div></div>");
    [].forEach.call(body.querySelectorAll(".audio"), function (list) { [].forEach.call(list.children, function (b) { b.addEventListener("click", function () { [].forEach.call(list.children, function (x) { x.classList.remove("on"); }); b.classList.add("on"); }); }); });
    ask({ eyebrow: "6 of 6 · Sound", title: "Voice and music", sub: "Press play to hear your opening line and each track.", body: body, go: "Sounds good", links: ["Use my own track"], next: function () {
      var v = body.querySelector("#voices .on b").textContent.replace(" · Claude's pick", ""), m = body.querySelector("#music .on b").textContent.replace(" · Claude's pick", "");
      filmAdd("sound", "Sound", "<b>" + v + " · " + m + "</b>");
      framesWork();
    } });
  }

  // ---------- 5. style frames ----------
  function framesWork() {
    phases(3);
    status("working", "Drawing style frames…");
    working("Drawing the key frames", "The hook, the product moment and the close, in your direction and look. Nothing moves yet.", 3);
    run([
      [800, function () { log("Drew style frame: the hook", "Swiss grid, your paper and ink", ["../img/styleframe-hook.jpg"]); fillSlot(0, "../img/styleframe-hook.jpg"); }],
      [1000, function () { log("Drew style frame: the product", "simplified UI, one mint accent", ["../img/styleframe-product.jpg"]); fillSlot(1, "../img/styleframe-product.jpg"); }],
      [900, function () { log("Drew style frame: the close", "logo lockup and URL"); fillSlot(2, "img/brand-E.jpg"); }],
    ], framesAsk);
  }
  function framesAsk() {
    var body = h('<div class="choices three"><div class="choice on"><img src="../img/styleframe-hook.jpg" alt=""><div class="body"><h3>The hook</h3></div></div><div class="choice on"><img src="../img/styleframe-product.jpg" alt=""><div class="body"><h3>The product</h3></div></div><div class="choice on"><img src="img/brand-E.jpg" alt=""><div class="body"><h3>The close</h3></div></div></div>');
    ask({ eyebrow: "Last check before building", title: "Are these the right frames?", sub: "This is how the film will look. Approve and Claude animates every scene from here. Or tell it what to change.", body: body, go: "Yes, animate it", links: ["Change something"], hint: "Last question until the render", next: function () {
      filmAdd("frames", "Style frames", '<b>Approved</b><img src="../img/styleframe-hook.jpg" alt="">');
      build();
    } });
  }

  // ---------- 6. build ----------
  var SCENES = [
    ["Hook", "../img/styleframe-hook.jpg"], ["The shoebox", "img/brand-D.jpg"], ["One tap", "img/brand-A.jpg"], ["It files itself", "img/brand-C.jpg"], ["Categories", "img/brand-B.jpg"],
    ["The month balances", "../img/styleframe-product.jpg"], ["A year of books", "img/brand-F.jpg"], ["Tax day", "img/brand-A.jpg"], ["tally.app", "img/brand-E.jpg"],
  ];
  function build() {
    phases(4);
    auto = false;
    $("#decide-rest").hidden = true;
    status("working", "Animating scene 1 of 9…");
    stage.innerHTML = "";
    var card = h('<div class="card"><div class="q-eyebrow">Building</div><h2 class="q-title">Claude is animating your film</h2><p class="q-sub">Each scene is designed and animated from your direction, then checked against your motion. You can leave this tab open and come back.</p><div class="progress"><i id="pg"></i></div><p class="q-sub" id="pgtext" style="margin:0 0 18px;font-size:14px">Scene 1 of 9</p><div class="scenes" id="scenes"></div></div>');
    stage.appendChild(card);
    var grid = $("#scenes");
    SCENES.forEach(function (s, i) { grid.appendChild(h('<div class="scene"><div class="th"></div><div class="meta"><b>' + (i + 1) + ". " + s[0] + '</b><em class="state">queued</em></div></div>')); });
    var t = 400;
    SCENES.forEach(function (s, i) {
      later(t, function () {
        var el = grid.children[i];
        el.querySelector(".state").className = "state working"; el.querySelector(".state").textContent = "animating";
        status("working", "Animating scene " + (i + 1) + " of 9…");
        log("Animating scene " + (i + 1) + ": " + s[0], "from DIRECTION.md and motion.md");
        $("#pgtext").textContent = "Scene " + (i + 1) + " of 9";
      });
      t += 900;
      later(t, function () {
        var el = grid.children[i];
        el.querySelector(".th").innerHTML = '<img src="' + s[1] + '" alt="">';
        el.querySelector(".state").className = "state done"; el.querySelector(".state").textContent = "checked ✓";
        $("#pg").style.width = Math.round(((i + 1) / 9) * 80) + "%";
      });
      t += 150;
    });
    later(t + 300, function () { status("working", "Adding voice and music…"); log("Added voice and music", "Maya · Felt piano, ducked under the voice"); $("#pgtext").textContent = "Mixing sound"; $("#pg").style.width = "88%"; });
    later(t + 1500, function () { status("working", "Checking every scene…"); log("Checked the motion in every scene", "0 problems"); $("#pg").style.width = "94%"; });
    later(t + 2600, function () { status("working", "Rendering 45 s at 1080p…"); log("Rendering", "45 s · 1920×1080 · H.264"); $("#pgtext").textContent = "Rendering"; $("#pg").style.width = "100%"; });
    later(t + 4200, finalView);
  }
  function finalView() {
    logDone();
    log("Your film is ready", "videos/tally-launch/renders/tally-launch.mp4");
    logDone();
    status("done", "Done: your film is ready");
    $("#phases").querySelectorAll(".phase").forEach(function (p) { p.className = "phase done"; });
    stage.innerHTML = "";
    stage.appendChild(h('<div class="card"><div class="q-eyebrow">Done</div><h2 class="q-title">Your film is ready</h2><p class="q-sub">45 seconds, in your brand, every scene checked.</p><div class="final"><div class="player"><img src="../img/styleframe-hook.jpg" alt="The finished film"><button type="button" aria-label="Play"></button><span class="dur">0:45</span></div><div><ul class="checks"><li>9 scenes animated <b>✓</b></li><li>Motion matches "Precise" <b>✓</b></li><li>Brand colors and fonts <b>✓</b></li><li>Voice and music mixed <b>✓</b></li></ul><div class="actions"><button class="primary" type="button">Download MP4</button><button class="link" type="button">Make a change</button><button class="link" type="button">Make a 9:16 cut</button></div></div></div></div>'));
    filmAdd("render", "Render", "<b>tally-launch.mp4 · 0:45</b>");
  }

  // ---------- global controls ----------
  $("#decide-rest").addEventListener("click", function () {
    auto = true;
    $("#decide-rest").textContent = "Claude is deciding…";
    var btn = stage.querySelector(".primary"); if (btn && !stage.querySelector(".spinner")) btn.click();
  });
  $("#tell").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.value.trim()) { log("You: " + e.target.value.trim(), "Claude will fold this in"); logDone(); e.target.value = ""; }
  });
  // review shortcuts: console.html#direction, #look, #motion, #sound, #frames, #build, #done
  var JUMP = { brief: briefAsk, direction: directionAsk, story: storyAsk, look: lookAsk, motion: motionAsk, sound: audioAsk, frames: framesAsk, build: build, done: finalView };
  var j = location.hash.slice(1);
  if (JUMP[j]) {
    $("#project").textContent = "Tally launch film"; $("#decide-rest").hidden = false; feed.innerHTML = "";
    var order = ["brief", "direction", "story", "look", "motion", "sound", "frames", "build", "done"], ph = [0, 1, 1, 2, 2, 2, 3, 4, 4];
    phases(ph[order.indexOf(j)]);
    log("Read your request", "launch film · 45 s · tally.app"); log("Read your brand file", "paper, ink and one mint accent"); logDone();
    if (order.indexOf(j) > 0) filmAdd("brief", "The plan", "<b>Launch film · 45 s · 16:9 · voiceover</b>");
    if (order.indexOf(j) > 1) filmAdd("direction", "Direction", "<b>Swiss grid launch film</b><div class=\"terms\"><span>simplified UI</span><span>Swiss grid</span><span>precise motion</span></div>");
    if (order.indexOf(j) > 3) filmAdd("look", "Look", "<b>Swiss grid</b><img src=\"img/brand-A.jpg\" alt=\"\">");
    JUMP[j]();
  } else start();
})();
</script>
</body>
</html>
